        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-37.0"
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-${{ env.ANDROID_RUST_TARGET }}-maapvz-apk
      - uses: actions/cache@v6
        with:
          path: .cache
          key: maapvz-agent-core-3.13.15-maafw5.14.0

      - name: Cache the Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
