      # On pull_request, github.sha is the synthetic merge commit, so prefer the
      # real head commit. The uploaded APK and runtime archive carry this suffix,
      # which keeps a downloaded package traceable to an actual commit.
      - name: Resolve the commit hash suffix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "SHORT_SHA=$(printf '%s' "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Point the Android build at the MAAPVZ profile
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pi.profile=$GITHUB_WORKSPACE/resource/maapvz.toml"
          } > src-tauri/gen/android/local.properties
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Clone the pinned MAAPVZ resource and build its runtime
        run: |
          python3 scripts/build-resource.py \
            https://github.com/Maa-Assistant-PVZ-The-best/MAAPVZ.git \
            --id maapvz \
            --ref 573b542a3ae0b8a648e541de9f062be0e38acb64 \
            --submodules \
            --exclude pillow \
            --exclude win32-setctime \
            --exclude colorama \
            --exclude jeepney \
            --exclude onnxruntime \
            --require pillow==11.0.0 \
            --abi "$ANDROID_ABI"

      - name: Build the $ANDROID_ABI debug APK
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --target "$TAURI_ANDROID_TARGET" --apk --debug --split-per-abi

      # Rename the runtime ZIP and the APKs so every downloadable file names the
