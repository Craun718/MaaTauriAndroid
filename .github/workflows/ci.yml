name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_abi:
        description: Android ABI for resource APK jobs
        type: choice
        options:
          - arm64-v8a
          - x86_64
        default: arm64-v8a

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.m9a == 'true' || steps.filter.outputs.narutomobile == 'true' || steps.filter.outputs.maapvz == 'true' }}
      m9a: ${{ steps.filter.outputs.m9a == 'true' || steps.filter.outputs.common == 'true' }}
      narutomobile: ${{ steps.filter.outputs.narutomobile == 'true' || steps.filter.outputs.common == 'true' }}
      maapvz: ${{ steps.filter.outputs.maapvz == 'true' || steps.filter.outputs.common == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common:
              - 'scripts/build-resource.py'
              - 'scripts/prepare-pi.py'
              - 'scripts/build-agent-runtime.sh'
              - 'scripts/build_agent_bundle.py'
              - 'scripts/fetch-maafw.sh'
              - 'scripts/env.sh'
              - 'src/**'
              - 'src-tauri/profiles/**'
              - 'src-tauri/src/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/gen/android/**'
              - 'vendor/maa/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            m9a:
              - 'resource/m9a.toml'
            narutomobile:
              - 'resource/narutomobile.toml'
            maapvz:
              - 'resource/maapvz.toml'

  frontend:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/

  rust:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  python-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Pinned so a new Ruff release cannot turn the gate red on its own. The
      # rule set and the excluded third-party trees live in ruff.toml;
      # `scripts/build_agent_bundle.py` is a vendored AGPL-3.0 copy, which is
      # why the selection stays narrow.
      - run: pip install ruff==0.16.2
      - run: ruff check .

  android-rust:
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      ANDROID_ABI: ${{ inputs.android_abi || 'arm64-v8a' }}
      ANDROID_RUST_TARGET: ${{ inputs.android_abi == 'x86_64' && 'x86_64-linux-android' || 'aarch64-linux-android' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_RUST_TARGET }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "ndk;28.2.13676358"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-${{ env.ANDROID_RUST_TARGET }}
      - run: |
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358"
            echo "AR=$toolchain/llvm-ar"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang"
            echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang++"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android35-clang"
            echo "CC_x86_64_linux_android=$toolchain/x86_64-linux-android35-clang"
            echo "CXX_x86_64_linux_android=$toolchain/x86_64-linux-android35-clang++"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$toolchain/x86_64-linux-android35-clang"
          } >> "$GITHUB_ENV"
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target "$ANDROID_RUST_TARGET" --features tauri/custom-protocol --lib

  android-gradle:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # buildSrc is its own Gradle build: there is no gradlew at the repository
      # root, and the Android settings.gradle applies tauri.settings.gradle,
      # which the Tauri CLI only generates during the APK build below. Run the
      # tests from buildSrc so they do not depend on generated files.
      - name: Run buildSrc tests
        working-directory: src-tauri/gen/android/buildSrc
        run: ../gradlew test

  m9a-android:
    needs: [changes, android-gradle]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.m9a == 'true') && needs.android-gradle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      # The Python agent runtime is built by the vendored script
      # scripts/build_agent_bundle.py (AGPL-3.0, from MaaFwApp);
      # MAAFW_CORE_REPO defaults to scripts/env.sh.
      # Keep in sync with the MaaFramework binaries vendored in vendor/maa/.
      MAAFW_VERSION: v5.14.0
      MAAFW_CORE_TAG: agent-core-3.13.15-maafw5.14.0
      ANDROID_ABI: ${{ inputs.android_abi || 'arm64-v8a' }}
      ANDROID_RUST_TARGET: ${{ inputs.android_abi == 'x86_64' && 'x86_64-linux-android' || 'aarch64-linux-android' }}
      TAURI_ANDROID_TARGET: ${{ inputs.android_abi == 'x86_64' && 'x86_64' || 'aarch64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_RUST_TARGET }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      # API 37 ships as the minor-numbered package android-37.0, while AGP
      # looks the platform up by the bare android-37 hash: symlink it into
      # place after installing (see flutter/flutter#192478).
      - name: Install the Android SDK platform
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-37.0"
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-${{ env.ANDROID_RUST_TARGET }}-apk
      - uses: actions/cache@v6
        with:
          path: .cache
          key: m9a-agent-core-3.13.15-maafw5.14.0
      # Pin the debug keystore. Without this every run generates a fresh one, so
      # each APK is signed with a different key: `adb install -r` then fails with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE and verifying a build on a device
      # requires uninstalling first, which wipes the app data.
      - name: Cache the Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # On pull_request, github.sha is the synthetic merge commit, so prefer the
      # real head commit. The uploaded APK and runtime archive carry this suffix,
      # which keeps a downloaded package traceable to an actual commit.
      - name: Resolve the commit hash suffix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "SHORT_SHA=$(printf '%s' "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Point the Android build at the M9A profile
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pi.profile=$GITHUB_WORKSPACE/resource/m9a.toml"
          } > src-tauri/gen/android/local.properties
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358"
            toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
            echo "AR=$toolchain/llvm-ar"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang"
            echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang++"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android35-clang"
            echo "CC_x86_64_linux_android=$toolchain/x86_64-linux-android35-clang"
            echo "CXX_x86_64_linux_android=$toolchain/x86_64-linux-android35-clang++"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$toolchain/x86_64-linux-android35-clang"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Clone the pinned M9A resource and build its runtime
        run: |
          python3 scripts/build-resource.py \
            https://github.com/MAA1999/M9A.git \
            --id m9a \
            --ref 4a19a626ce93ec5ab027e734590213bad7f04c12 \
            --submodules \
            --exclude pillow \
            --require pillow==11.0.0 \
            --abi "$ANDROID_ABI"

      - name: Generate the Tauri Android Gradle dependencies
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/src-tauri/gen/android
          WRY_ANDROID_PACKAGE: top.natsuu.mta
          WRY_ANDROID_LIBRARY: maa_tauri_android_lib
        run: |
          pnpm install --frozen-lockfile
          # tauri-build does not declare this variable as a rerun trigger, so
          # invalidate only the app build script when reusing a cached target.
          cargo clean --manifest-path src-tauri/Cargo.toml --package maa_tauri_android
          cargo check --manifest-path src-tauri/Cargo.toml --target "$ANDROID_RUST_TARGET" --lib

      - name: Build the $ANDROID_ABI debug APK
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --target "$TAURI_ANDROID_TARGET" --apk --debug --split-per-abi

      - name: Run app unit tests
        working-directory: src-tauri/gen/android
        run: |
          flavor="${ANDROID_ABI%-v8a}"
          ./gradlew ":app:test${flavor^}DebugUnitTest"

      # Rename the runtime ZIP and the APKs so every downloadable file names the
      # commit it was built from. This runs after the Gradle build: the profile
      # resolves `bundle` by its plain name, so renaming it earlier would break
      # the packaging step.
      - name: Suffix the artifacts with the commit hash
        run: |
          mv "resource/m9a-agent-runtime-${ANDROID_ABI}.zip" \
             "resource/m9a-agent-runtime-${ANDROID_ABI}-${SHORT_SHA}.zip"
          apks=()
          while IFS= read -r -d '' apk; do apks+=("$apk"); done \
            < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0)
          [ "${#apks[@]}" -gt 0 ] || { echo "no APK found to suffix" >&2; exit 1; }
          for apk in "${apks[@]}"; do
            mv "$apk" "${apk%.apk}-${SHORT_SHA}.apk"
          done

      - name: Upload the agent runtime archive
        uses: actions/upload-artifact@v7
        with:
          name: m9a-agent-runtime-${{ env.ANDROID_ABI }}-${{ env.SHORT_SHA }}
          path: resource/m9a-agent-runtime-${{ env.ANDROID_ABI }}-${{ env.SHORT_SHA }}.zip

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: m9a-apk-debug-${{ env.SHORT_SHA }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  narutomobile-android:
    needs: [changes, android-gradle]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.narutomobile == 'true') && needs.android-gradle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      # Keep in sync with scripts/env.sh and the M9A job.
      MAAFW_VERSION: v5.14.0
      MAAFW_CORE_TAG: agent-core-3.13.15-maafw5.14.0
      ANDROID_ABI: ${{ inputs.android_abi || 'arm64-v8a' }}
      ANDROID_RUST_TARGET: ${{ inputs.android_abi == 'x86_64' && 'x86_64-linux-android' || 'aarch64-linux-android' }}
      TAURI_ANDROID_TARGET: ${{ inputs.android_abi == 'x86_64' && 'x86_64' || 'aarch64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_RUST_TARGET }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      # API 37 ships as the minor-numbered package android-37.0, while AGP
      # looks the platform up by the bare android-37 hash: symlink it into
      # place after installing (see flutter/flutter#192478).
      - name: Install the Android SDK platform
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-37.0"
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-${{ env.ANDROID_RUST_TARGET }}-narutomobile-apk
      - uses: actions/cache@v6
        with:
          path: .cache
          key: narutomobile-agent-core-3.13.15-maafw5.14.0

      - name: Cache the Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # On pull_request, github.sha is the synthetic merge commit, so prefer the
      # real head commit. The uploaded APK and runtime archive carry this suffix,
      # which keeps a downloaded package traceable to an actual commit.
      - name: Resolve the commit hash suffix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "SHORT_SHA=$(printf '%s' "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Point the Android build at the NarutoMobile profile
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pi.profile=$GITHUB_WORKSPACE/resource/narutomobile.toml"
          } > src-tauri/gen/android/local.properties
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Clone the pinned NarutoMobile resource and build its runtime
        run: |
          python3 scripts/build-resource.py \
            https://github.com/duorua/narutomobile.git \
            --id narutomobile \
            --ref 9d245df1bbe9f72b43324e018ea08e9cca3d2d6a \
            --submodules \
            --exclude pillow \
            --exclude win32-setctime \
            --exclude colorama \
            --exclude jeepney \
            --require pillow==11.0.0 \
            --abi "$ANDROID_ABI"

      - name: Build the $ANDROID_ABI debug APK
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --target "$TAURI_ANDROID_TARGET" --apk --debug --split-per-abi

      # Rename the runtime ZIP and the APKs so every downloadable file names the
      # commit it was built from. This runs after the Gradle build: the profile
      # resolves `bundle` by its plain name, so renaming it earlier would break
      # the packaging step.
      - name: Suffix the artifacts with the commit hash
        run: |
          mv "resource/narutomobile-agent-runtime-${ANDROID_ABI}.zip" \
             "resource/narutomobile-agent-runtime-${ANDROID_ABI}-${SHORT_SHA}.zip"
          apks=()
          while IFS= read -r -d '' apk; do apks+=("$apk"); done \
            < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0)
          [ "${#apks[@]}" -gt 0 ] || { echo "no APK found to suffix" >&2; exit 1; }
          for apk in "${apks[@]}"; do
            mv "$apk" "${apk%.apk}-${SHORT_SHA}.apk"
          done

      - name: Upload the agent runtime archive
        uses: actions/upload-artifact@v7
        with:
          name: narutomobile-agent-runtime-${{ env.ANDROID_ABI }}-${{ env.SHORT_SHA }}
          path: resource/narutomobile-agent-runtime-${{ env.ANDROID_ABI }}-${{ env.SHORT_SHA }}.zip

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: narutomobile-apk-debug-${{ env.SHORT_SHA }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  maapvz-android:
