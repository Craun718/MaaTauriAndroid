name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      m9a: ${{ steps.filter.outputs.m9a }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            m9a:
              - 'resource/m9a/**'
              - 'resource/m9a.toml'
              - 'src/**'
              - 'src-tauri/profiles/**'
              - 'src-tauri/src/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/gen/android/**'
              - 'vendor/maa/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  android-rust:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "ndk;28.2.13676358"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-aarch64
      - run: |
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "AR=$toolchain/llvm-ar" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --features tauri/custom-protocol --lib

  m9a-android:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.m9a == 'true')
    runs-on: ubuntu-latest
    env:
      # Pinned commit of Aliothmoon/MaaFwApp whose scripts/build_agent_bundle.py
      # builds the Python agent runtime (verified byte-identical to the local
      # reference clone; refresh the pin when updating the bundle).
      MAAFW_SCRIPT_REF: f4f6f220e21e3a1b7b0cf5df4bdbe0ec04c668f7
      # Keep in sync with the MaaFramework binaries vendored in vendor/maa/.
      MAAFW_VERSION: v5.13.0-beta.5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-aarch64-apk
      - uses: actions/cache@v6
        with:
          path: .cache
          key: m9a-agent-core-3.13.15-maafw5.12.3
      # Pin the debug keystore. Without this every run generates a fresh one, so
      # each APK is signed with a different key: `adb install -r` then fails with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE and verifying a build on a device
      # requires uninstalling first, which wipes the app data.
      - name: Cache the Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Point the Android build at the M9A profile
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pi.profile=$GITHUB_WORKSPACE/resource/m9a.toml"
          } > src-tauri/gen/android/local.properties
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Download MaaFramework and build the agent runtime
        run: |
          scripts/fetch-maafw.sh
          scripts/build-agent-runtime.sh

      # buildSrc is its own Gradle build: there is no gradlew at the repository
      # root, and the Android settings.gradle applies tauri.settings.gradle,
      # which the Tauri CLI only generates during the APK build below. Run the
      # tests from buildSrc so they do not depend on generated files.
      - name: Run buildSrc tests
        working-directory: src-tauri/gen/android/buildSrc
        run: ../gradlew test

      - name: Generate M9A OCR models
        working-directory: resource/m9a
        run: python3 tools/configure.py

      - name: Build the arm64 debug APK
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --target aarch64 --apk --debug

      - name: Upload the agent runtime archive
        uses: actions/upload-artifact@v7
        with:
          name: m9a-agent-runtime-arm64-v8a
          path: resource/m9a-agent-runtime-arm64-v8a.zip

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: m9a-apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
