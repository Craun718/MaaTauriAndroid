name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      m9a: ${{ steps.filter.outputs.m9a == 'true' || steps.filter.outputs.common == 'true' }}
      narutomobile: ${{ steps.filter.outputs.narutomobile == 'true' || steps.filter.outputs.common == 'true' }}
      maapvz: ${{ steps.filter.outputs.maapvz == 'true' || steps.filter.outputs.common == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common:
              - 'scripts/build-resource.py'
              - 'scripts/prepare-pi.py'
              - 'scripts/build-agent-runtime.sh'
              - 'scripts/build_agent_bundle.py'
              - 'scripts/fetch-maafw.sh'
              - 'scripts/env.sh'
              - 'src/**'
              - 'src-tauri/profiles/**'
              - 'src-tauri/src/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/gen/android/**'
              - 'vendor/maa/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            m9a:
              - 'resource/m9a.toml'
            narutomobile:
              - 'resource/narutomobile.toml'
            maapvz:
              - 'resource/maapvz.toml'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  android-rust:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "ndk;28.2.13676358"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-aarch64
      - run: |
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "AR=$toolchain/llvm-ar" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --features tauri/custom-protocol --lib

  m9a-android:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.m9a == 'true')
    runs-on: ubuntu-latest
    env:
      # The Python agent runtime is built by the vendored script
      # scripts/build_agent_bundle.py (AGPL-3.0, from MaaFwApp);
      # MAAFW_CORE_REPO defaults to scripts/env.sh.
      # Keep in sync with the MaaFramework binaries vendored in vendor/maa/.
      MAAFW_VERSION: v5.13.0
      MAAFW_CORE_TAG: 3.13.15-maafw5.13.0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      # API 37 ships as the minor-numbered package android-37.0, while AGP
      # looks the platform up by the bare android-37 hash: symlink it into
      # place after installing (see flutter/flutter#192478).
      - name: Install the Android SDK platform
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-37.0"
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-aarch64-apk
      - uses: actions/cache@v6
        with:
          path: .cache
          key: m9a-agent-core-3.13.15-maafw5.13.0
      # Pin the debug keystore. Without this every run generates a fresh one, so
      # each APK is signed with a different key: `adb install -r` then fails with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE and verifying a build on a device
      # requires uninstalling first, which wipes the app data.
      - name: Cache the Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Point the Android build at the M9A profile
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pi.profile=$GITHUB_WORKSPACE/resource/m9a.toml"
          } > src-tauri/gen/android/local.properties
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Clone the pinned M9A resource and build its runtime
        run: |
          python3 scripts/build-resource.py \
            https://github.com/MAA1999/M9A.git \
            --id m9a \
            --ref 4a19a626ce93ec5ab027e734590213bad7f04c12 \
            --submodules \
            --exclude pillow \
            --require pillow==11.0.0

      # buildSrc is its own Gradle build: there is no gradlew at the repository
      # root, and the Android settings.gradle applies tauri.settings.gradle,
      # which the Tauri CLI only generates during the APK build below. Run the
      # tests from buildSrc so they do not depend on generated files.
      - name: Run buildSrc tests
        working-directory: src-tauri/gen/android/buildSrc
        run: ../gradlew test

      - name: Build the arm64 debug APK
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --target aarch64 --apk --debug --split-per-abi

      - name: Upload the agent runtime archive
        uses: actions/upload-artifact@v7
        with:
          name: m9a-agent-runtime-arm64-v8a
          path: resource/m9a-agent-runtime-arm64-v8a.zip

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: m9a-apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  narutomobile-android:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.narutomobile == 'true')
    runs-on: ubuntu-latest
    env:
      # Keep in sync with scripts/env.sh and the M9A job.
      MAAFW_VERSION: v5.13.0
      MAAFW_CORE_TAG: 3.13.15-maafw5.13.0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      # API 37 ships as the minor-numbered package android-37.0, while AGP
      # looks the platform up by the bare android-37 hash: symlink it into
      # place after installing (see flutter/flutter#192478).
      - name: Install the Android SDK platform
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-37.0"
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-aarch64-narutomobile-apk
      - uses: actions/cache@v6
        with:
          path: .cache
          key: narutomobile-agent-core-3.13.15-maafw5.13.0

      - name: Cache the Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Point the Android build at the NarutoMobile profile
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pi.profile=$GITHUB_WORKSPACE/resource/narutomobile.toml"
          } > src-tauri/gen/android/local.properties
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Clone the pinned NarutoMobile resource and build its runtime
        run: |
          python3 scripts/build-resource.py \
            https://github.com/duorua/narutomobile.git \
            --id narutomobile \
            --ref 9d245df1bbe9f72b43324e018ea08e9cca3d2d6a \
            --submodules \
            --exclude pillow \
            --exclude win32-setctime \
            --exclude colorama \
            --exclude jeepney \
            --require pillow==11.0.0

      - name: Run buildSrc tests
        working-directory: src-tauri/gen/android/buildSrc
        run: ../gradlew test

      - name: Build the arm64 debug APK
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --target aarch64 --apk --debug --split-per-abi

      - name: Upload the agent runtime archive
        uses: actions/upload-artifact@v7
        with:
          name: narutomobile-agent-runtime-arm64-v8a
          path: resource/narutomobile-agent-runtime-arm64-v8a.zip

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: narutomobile-apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  maapvz-android:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.maapvz == 'true')
    runs-on: ubuntu-latest
    env:
      # Keep in sync with scripts/env.sh and the M9A job.
      MAAFW_VERSION: v5.13.0
      MAAFW_CORE_TAG: 3.13.15-maafw5.13.0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      # API 37 ships as the minor-numbered package android-37.0, while AGP
      # looks the platform up by the bare android-37 hash: symlink it into
      # place after installing (see flutter/flutter#192478).
      - name: Install the Android SDK platform
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-37.0"
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: android-aarch64-maapvz-apk
      - uses: actions/cache@v6
        with:
          path: .cache
          key: maapvz-agent-core-3.13.15-maafw5.13.0

      - name: Cache the Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Point the Android build at the MAAPVZ profile
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pi.profile=$GITHUB_WORKSPACE/resource/maapvz.toml"
          } > src-tauri/gen/android/local.properties
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Clone the pinned MAAPVZ resource and build its runtime
        run: |
          python3 scripts/build-resource.py \
            https://github.com/Maa-Assistant-PVZ-The-best/MAAPVZ.git \
            --id maapvz \
            --ref 573b542a3ae0b8a648e541de9f062be0e38acb64 \
            --submodules \
            --exclude pillow \
            --exclude win32-setctime \
            --exclude colorama \
            --exclude jeepney \
            --exclude onnxruntime \
            --require pillow==11.0.0

      - name: Run buildSrc tests
        working-directory: src-tauri/gen/android/buildSrc
        run: ../gradlew test

      - name: Build the arm64 debug APK
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --target aarch64 --apk --debug --split-per-abi

      - name: Upload the agent runtime archive
        uses: actions/upload-artifact@v7
        with:
          name: maapvz-agent-runtime-arm64-v8a
          path: resource/maapvz-agent-runtime-arm64-v8a.zip

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: maapvz-apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
