# M9A 的 Project Interface profile。
#
# 相对路径解析规则（见 src-tauri/profiles/README.md）：
#   - pi_assets / agent.runtimes[].bundle 相对【本文件所在目录】，即 resource/
#   - maa_dir 相对【仓库根】
#
# 由 M9A `feat/support-android-app` 分支的 Android/profile.yaml 翻译而来，
# 差别是与子模块同仓后改用相对路径，且占位符 {nativeLibs} 对应本项目的 {nativeLib}。
#
# agent runtime 由 CI 每次重新构建，直接打包该产物即可。

pi_assets = "m9a"

resource_id = "m9a"

maa_dir = "vendor/maa/android"

# data/ 是 Agent 直接读取的协议外目录，显式加入 pi_include。
pi_include = ["data"]

# 打包内容由 interface.json 推导（见 src-tauri/profiles/README.md）：resource[].path 与
# import、languages 指向的文件、图标与富文本引用的图片，以及 agent 负载。
# pi_include 只表示「额外再打包这些」，无法删减推导出的集合，列出不存在的路径会让
# 构建失败。
# pi_exclude 已不再支持——推导出的集合无法被裁剪，写它只会得到一个静默无效的过滤器。
# 白名单曾静默失配——M9A v4.9.0 把 i18n/ 改名为 locales/ 后，构建照样通过，包却装不上。
#
# 需要塞进包里的协议外资产时才用，例如：
# pi_include = ["assets/extra/说明.pdf"]

# interface.json 声明 1 个 agent，因此这里必须恰好配置 1 个 runtime。
[agent]
timeout_ms = 15000

[[agent.runtimes]]
bundle = "m9a-agent-runtime-arm64-v8a.zip"
exec = "bin/python3"
executables = ["bin/python3"]
args = ["-u", "agent/main.py", "{identifier}"]
working_dir = "{pi}"

[agent.runtimes.env]
PYTHONHOME = "{bundle}/prefix"
PYTHONPATH = "{bundle}/site-packages/pure.zip:{bundle}/site-packages"
LD_LIBRARY_PATH = "{bundle}/prefix/lib:{bundle}/site-packages/chaquopy/lib:{bundle}/lib/arm64-v8a:{nativeLib}"
MAAFW_BINARY_PATH = "{bundle}/lib/arm64-v8a"
