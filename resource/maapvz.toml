# MAAPVZ Project Interface profile.
#
# The upstream repository keeps interface.json in assets/ and the agent at the
# repository root. scripts/prepare-pi.py flattens them into Android/pi-root/ and
# installs the OCR model at the path declared by the PI.

pi_assets = "maapvz/Android/pi-root"

resource_id = "maapvz"

mirrorchyan_rid = "MaaPVZ"

app_name = "MaaPVZ"

maa_dir = "vendor/maa/android"

# pi_include paths are relative to pi_assets, i.e. to the assembled pi-root, and a
# listed path that does not exist fails the build (see src-tauri/profiles/README.md).
#
# The interface stores "MIT" as prose rather than as a file reference, so the
# upstream license file must be added explicitly.
#
# coords.json is deliberately absent: upstream keeps it at
# agent/assets/resource/coords.json, and PiPackage packs the whole agent/ directory
# because interface.json declares an agent. main.py chdirs to its own directory
# ({pi}/agent) and loads "./assets/resource/coords.json" from there, so the derived
# set already covers it and no pi_include entry is needed.
pi_include = ["LICENSE"]

[agent]
timeout_ms = 15000

[[agent.runtimes]]
bundle = "maapvz-agent-runtime-{abi}.zip"
exec = "bin/python3"
executables = ["bin/python3"]
args = ["-u", "agent/main.py", "{identifier}"]
working_dir = "{pi}"

[agent.runtimes.env]
PYTHONHOME = "{bundle}/prefix"
PYTHONPATH = "{bundle}/site-packages/pure.zip:{bundle}/site-packages"
LD_LIBRARY_PATH = "{bundle}/prefix/lib:{bundle}/site-packages/chaquopy/lib:{bundle}/lib/{abi}:{nativeLib}"
MAAFW_BINARY_PATH = "{bundle}/lib/{abi}"
