# Lint config for every Python file this project owns: the build helpers in
# scripts/, the packaging profiles in src-tauri/profiles/, and anything else that
# lands in the repository. CI runs `ruff check .` (the `python-lint` job) and the
# pre-commit hook runs the same check on staged files.
#
# Every stable rule is selected. The ignore list below is not a style preference
# escape hatch: each entry is either a rule that another enabled rule or the
# formatter contradicts, or a rule whose only fix would rewrite these scripts
# into something worse. Preview rules are not enabled.
#
# Everything the repository does not own is excluded. `resource/` holds the
# CI-only clones of the upstream PI projects, `vendor/` the vendored MaaFramework
# artifacts, and `src-tauri/gen/` the generated Android project, which embeds an
# upstream project's python under app/build/generated/piAssets/. Biome already
# ignores those same three trees (see biome.json).
target-version = "py313"
extend-exclude = [
  # Third-party trees: upstream resources, vendored binaries, generated shell.
  "resource",
  "vendor",
  "src-tauri/gen",
  # Caches and scratch trees that are not the project's source: `.cache` holds
  # the downloaded agent core, `.worktrees` complete checkouts of this
  # repository, `src-tauri/target` the Rust build output. Ruff already skips
  # build/, dist/, node_modules/ and site-packages/ by default; these are the
  # ones it does not know about.
  ".cache",
  ".worktrees",
  "src-tauri/target",
]

[lint]
select = ["ALL"]
ignore = [
  # Rules that contradict each other or the formatter. `ruff format` is not part
  # of this pipeline, so the line length and comma rules would fight the hand
  # written wrapping the vendored scripts already use.
  "E501",   # line-too-long: wrapping is manual here
  "COM812", # missing-trailing-comma: the formatter adds these; conflicts with it
  "ISC001", # implicit-string-concat: conflicts with the formatter
  "D203",   # one-blank-line-before-class: incompatible with D211
  "D213",   # multi-line-summary-second-line: incompatible with D212

  # Rules this repository cannot satisfy by construction.
  "RUF001", "RUF002", "RUF003", # ambiguous unicode: comments and docstrings are Chinese
  "CPY001",                     # missing copyright notice: the repository has none

  # Rules that want a different program than these are. Every script here is a
  # CLI tool: printing the log line is the interface, and the vendored ones raise
  # SystemExit/RuntimeError with a formatted message at the raise site.
  "T201",                          # print
  "D103",                          # undocumented-public-function (69 public helpers)
  "TRY003", "EM101", "EM102",      # would turn ~67 raise messages into exception classes

  # Subprocess and network calls with a fixed argv / a constant https URL.
  "S603", "S607", # subprocess-without-shell-equals-true / start-process-with-partial-path

  # Complexity ceilings the vendored scripts exceed by design.
  "C901", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
]
