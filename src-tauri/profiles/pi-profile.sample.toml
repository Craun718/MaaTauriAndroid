# Copy this file outside the repository, then set in
# src-tauri/gen/android/local.properties:
# pi.profile=/absolute/path/to/your-pi-profile.toml

# Directory containing interface.json. Relative paths resolve against this
# profile file's directory.
pi_assets = "/absolute/path/to/your-maa-project"

# The packaged set is derived from interface.json: resource[].path, every import,
# the languages translation files, icons and rich-text images, the Agent payload,
# plus the data directory the Agent reads. A path the interface declares but the
# project lacks fails the build instead of shipping a package that cannot load.

# Optional. EXTRA project-relative paths to pack on top of that set — assets no
# protocol key reaches. This can only add; it never prunes, and a listed path
# that does not exist fails the build. Omit it when the interface covers
# everything.
# pi_include = ["assets/extra/guide.pdf"]

# applicationId suffix: top.natsuu.mta.<resource_id>
resource_id = "yourpi"

# Optional MirrorChyan update resource id. When set it overrides the value in
# interface.json; omit it to keep the interface's value.
mirrorchyan_rid = "yourpi"

# Optional Android launcher and activity title.
app_name = "Your PI"

# Optional virtual display orientation: "landscape" or "portrait".
# Omit it to keep the 1280x720 landscape virtual display.
virtual_display_orientation = "landscape"

# Optional. Relative paths resolve from the repository root.
maa_dir = "vendor/maa/android"

# Required when interface.json declares agents. Each runtime bundle is an
# Android ZIP containing lib/{abi}/libMaaAgentClient.so and
# lib/{abi}/libMaaAgentServer.so.
# Use "{abi}" in the bundle path and environment values to resolve to the ABI
# selected by the Android build (arm64-v8a by default).
[agent]
timeout_ms = 15000

[[agent.runtimes]]
bundle = "/absolute/path/to/agent-runtime.zip"
exec = "python/bin/python3"
executables = ["python/bin/python3"]
args = ["-u", "-m", "maa.agent.agent_server", "{identifier}"]
working_dir = "{pi}"

[agent.runtimes.env]
LD_LIBRARY_PATH = "{bundle}/lib/{abi}"
MAAFW_BINARY_PATH = "{bundle}/lib/{abi}"
PYTHONHOME = "{bundle}/python"
PYTHONPATH = "{pi}"

# Optional. Release signing for the APK produced with this profile. Without it the
# release build stays unsigned exactly as before; with it the release APK is signed
# by this keystore, so keep reusing one keystore per distribution — Android refuses
# to update an app whose signing key changed. Relative paths resolve against this
# profile file's directory, and the keystore must exist when the build starts.
# Never commit the keystore or the passwords to the repository.
# [signing]
# store_file = "/absolute/path/to/keystore.jks"
# store_password = "the-store-password"
# key_alias = "mta"
# key_password = "the-key-password" # optional; defaults to the store password
